# ==============================
# Application
# ==============================
spring.application.name=ecommerce
server.port=8080

# ==============================
# Datasource
# Defaults to file-based H2 for local development so data survives restarts.
# Spring Boot's relaxed environment-variable binding maps standard env vars
# straight onto these properties with higher precedence, so simply setting
# them in the environment overrides the defaults below without touching
# this file — no manual ${...} placeholders needed (and env var names can't
# contain hyphens, so hand-writing them here would be broken anyway).
# For production PostgreSQL, set:
#   SPRING_DATASOURCE_URL=jdbc:postgresql://<host>:5432/ecommerce
#   SPRING_DATASOURCE_USERNAME=<username>
#   SPRING_DATASOURCE_PASSWORD=<password>
#   SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.postgresql.Driver
#   SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.PostgreSQLDialect
# ==============================
spring.datasource.url=jdbc:h2:file:./data/ecommercedb;AUTO_SERVER=TRUE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ==============================
# JPA / Hibernate
# ==============================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# ==============================
# H2 Console (development only)
# ==============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# ==============================
# Jackson
# ==============================
spring.jackson.default-property-inclusion=non_null

# ==============================
# Logging
# ==============================
logging.level.com.example.ecommerce=INFO
